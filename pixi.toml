# tag::project-config[]
[workspace]
name = "globalprotect-openconnect"
version = "2.4.4"
description = "A GUI for GlobalProtect VPN, based on OpenConnect, supports the SSO authentication method. CLI build AND packaging working with pixi!"
authors = ["Kevin Yue <k3vinyue@gmail.com>"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]
# end::project-config[]

# tag::dependencies[]
[dependencies]
# Rust toolchain
rust = "1.82.*"
# Build tools
pkg-config = "*"
# System dependencies
openconnect = "*"
# OpenConnect transitive dependencies
gnutls = "*"
nettle = "*"
gmp = "*"
libxml2 = "*"
stoken = "*"
krb5 = "*"
p11-kit = "*"
libiconv = "*"
lz4-c = "*"
zlib = "*"

# GUI dependencies for GTK/Cairo
cairo = "*"
glib = "*"
gtk3 = "*"
pango = "*"
gdk-pixbuf = "*"
atk = "*"
# WebKit and soup dependencies
libsoup = "*"
# Missing dependency for fontconfig
expat = "*"
# Node.js for frontend
nodejs = "20.*"
# Additional build tools
perl = "*"
jq = "*"
git = "*"
# Rattler-build for packaging
rattler-build = "*"
# Documentation tools
asciidoctor = "*"
rb-asciidoctor-pdf = "*"
# end::dependencies[]

# Platform-specific dependencies
[target.linux-64.dependencies]
pcsclite = "*"

# tag::build-tasks[]

# =============================================================================
# Setup Actions
# =============================================================================

[tasks.setup-corepack]
cmd = "corepack enable"
cwd = "."
description = "Enable corepack for Node.js package management"

[tasks.setup-env]
cmd = "./pixi-scripts/setup-env.sh"
cwd = "."
inputs = ["scripts/env/setup-pkgconfig.sh"]
description = "Setup PKG_CONFIG_PATH environment"

# this is the show-env task
[tasks.show-env]
cmd = "./pixi-scripts/show-env.sh"
cwd = "."
description = "Show environment configuration"

# =============================================================================
# Build Actions
# =============================================================================

[tasks.build-frontend]
cmd = "pnpm install && pnpm build"
cwd = "apps/gpgui-helper"
description = "Build frontend components"
inputs = [
  "apps/gpgui-helper/package.json",
  "apps/gpgui-helper/pnpm-lock.yaml",
  "apps/gpgui-helper/src/**/*",
  "apps/gpgui-helper/public/**/*",
  "apps/gpgui-helper/index.html",
  "apps/gpgui-helper/vite.config.ts",
  "apps/gpgui-helper/tsconfig.json"
]
outputs = ["apps/gpgui-helper/dist/**/*"]

[tasks.build-rust]
cmd = "./pixi-scripts/build-rust.sh"
cwd = "."
description = "Build Rust CLI components only (avoiding webkit dependencies)"
inputs = [
  "Cargo.toml",
  "Cargo.lock",
  "apps/gpclient/Cargo.toml",
  "apps/gpservice/Cargo.toml",
  "apps/gpauth/Cargo.toml",
  "crates/**/Cargo.toml",
  "apps/gpclient/src/**/*.rs",
  "apps/gpservice/src/**/*.rs",
  "apps/gpauth/src/**/*.rs",
  "crates/**/src/**/*.rs",
  "scripts/env/setup-pkgconfig.sh"
]
outputs = [
  "target/release/gpclient",
  "target/release/gpservice",
  "target/release/gpauth"
]

[tasks.build-gui]
cmd = "./pixi-scripts/build-gui.sh"
cwd = "."
description = "Build GUI components (requires system webkit dependencies, provides instructions if missing)"
inputs = [
  "Cargo.toml",
  "Cargo.lock",
  "apps/gpgui-helper/src-tauri/Cargo.toml",
  "apps/gpgui-helper/src-tauri/src/**/*.rs",
  "crates/**/Cargo.toml",
  "crates/**/src/**/*.rs"
]
# Note: outputs are optional - GUI build may be skipped if webkit dependencies unavailable

[tasks.build-all]
depends-on = ["setup-corepack", "build-frontend", "build-rust", "build-gui"]
description = "Complete build process"


[tasks.build-cli]
cmd = "./pixi-scripts/build-cli.sh"
cwd = "."
description = "Build CLI binaries only"
inputs = [
  "Cargo.toml",
  "Cargo.lock",
  "apps/gpclient/Cargo.toml",
  "apps/gpservice/Cargo.toml",
  "apps/gpauth/Cargo.toml",
  "crates/**/Cargo.toml",
  "apps/gpclient/src/**/*.rs",
  "apps/gpservice/src/**/*.rs",
  "apps/gpauth/src/**/*.rs",
  "crates/**/src/**/*.rs",
  "scripts/env/setup-pkgconfig.sh"
]
outputs = [
  "target/release/gpclient",
  "target/release/gpservice",
  "target/release/gpauth"
]
# end::build-tasks[]

# =============================================================================
# Test Actions
# =============================================================================

[tasks.test-cli]
cmd = "./pixi-scripts/test-cli.sh"
cwd = "."
description = "Test CLI functionality"
inputs = [
  "target/release/gpclient",
  "target/release/gpservice",
  "target/release/gpauth"
]

[tasks.test-all]
cmd = "./target/release/gpclient --help"
cwd = "."
description = "Full test suite"
inputs = ["target/release/gpclient"]


[tasks.test-cli-comprehensive]
cmd = "./pixi-scripts/test-cli-comprehensive.sh"
cwd = "."
description = "Comprehensive CLI testing"
inputs = [
  "target/release/gpclient",
  "target/release/gpservice",
  "target/release/gpauth"
]

# =============================================================================
# Package Actions
# =============================================================================

[tasks.tarball]
cmd = "./pixi-scripts/tarball.sh"
description = "Create source tarball for distribution"
inputs = [
  "Cargo.toml",
  "Cargo.lock",
  "apps/**/*",
  "crates/**/*",
  "scripts/**/*",
  "pixi-scripts/**/*",
  "packaging/**/*",
  "*.md",
  "LICENSE*"
]
outputs = [".build/tarball/*.tar.gz"]

[tasks.download-gui]
cmd = "./pixi-scripts/download-gui.sh"
description = "Download GUI components"
outputs = [".build/gpgui/**/*"]

[tasks.init-debian]
cmd = "./pixi-scripts/init-debian.sh"
depends-on = ["clean-debian", "tarball"]
description = "Initialize Debian package build"

[tasks.deb]
cmd = "./pixi-scripts/deb.sh"
depends-on = ["init-debian"]
description = "Build Debian package"
inputs = [".build/deb/**/*"]
outputs = [".build/deb/*.deb"]

[tasks.check-ppa]
cmd = """
if [ "$OFFLINE" -ne 1 ]; then
  echo \"Error: ppa build requires offline mode (OFFLINE=1)\"\n  exit 1
fi
"""
description = "Check PPA build requirements"

[tasks.ppa]
cmd = "./pixi-scripts/ppa.sh"
depends-on = ["check-ppa", "init-debian"]
description = "Build PPA package"

[tasks.init-rpm]
cmd = "./pixi-scripts/init-rpm.sh"
depends-on = ["clean-rpm"]
description = "Initialize RPM package build"

[tasks.rpm]
cmd = "./pixi-scripts/rpm.sh"
depends-on = ["init-rpm", "tarball"]
description = "Build RPM package"
inputs = [".build/rpm/**/*", ".build/tarball/*.tar.gz"]
outputs = [".build/rpm/*.rpm"]

[tasks.init-pkgbuild]
cmd = "./pixi-scripts/init-pkgbuild.sh"
depends-on = ["clean-pkgbuild", "tarball"]
description = "Initialize Arch Linux package build"

[tasks.pkgbuild]
cmd = "./pixi-scripts/pkgbuild.sh"
depends-on = ["init-pkgbuild"]
description = "Build Arch Linux package"
inputs = [".build/pkgbuild/**/*", ".build/tarball/*.tar.gz"]
outputs = [".build/pkgbuild/*.pkg.tar.*"]

[tasks.binary]
cmd = "./pixi-scripts/binary.sh"
depends-on = ["clean-binary", "tarball"]
description = "Build binary distribution package"
inputs = [".build/tarball/*.tar.gz"]
outputs = [".build/binary/*.bin.tar.xz", ".build/binary/*.bin.tar.xz.sha256"]

[tasks.package-full]
cmd = "rattler-build build --recipe recipe.yaml"
cwd = "."
description = "Build full conda package (with GUI)"
inputs = [
  "recipe.yaml",
  "target/release/**/*",
  "apps/gpgui-helper/dist/**/*"
]
outputs = ["output/*.conda"]


[tasks.package-cli]
cmd = "rattler-build build --recipe recipe-cli.yaml"
cwd = "."
description = "Build CLI conda package"
inputs = [
  "recipe-cli.yaml",
  "target/release/gpclient",
  "target/release/gpservice",
  "target/release/gpauth"
]
outputs = ["output/*.conda"]

[tasks.view-package-contents]
cmd = "./pixi-scripts/view-package-contents.sh"
cwd = "."
description = "View contents of built conda packages"
inputs = ["output/linux-64/*.conda"]

[tasks.show-package-status]
cmd = "./pixi-scripts/show-package-status.sh"
cwd = "."
description = "Show status of built packages"
inputs = ["output/linux-64/*.conda"]

# =============================================================================
# Quality Actions
# =============================================================================

[tasks.lint-code]
cmd = "./pixi-scripts/lint-code.sh"
cwd = "."
description = "Run cargo clippy with warnings as errors"
inputs = [
  "Cargo.toml",
  "Cargo.lock",
  "apps/**/Cargo.toml",
  "crates/**/Cargo.toml",
  "apps/**/src/**/*.rs",
  "crates/**/src/**/*.rs",
  "scripts/env/setup-pkgconfig.sh"
]


[tasks.format-code]
cmd = "cargo fmt"
cwd = "."
description = "Format code with rustfmt"
inputs = [
  "Cargo.toml",
  "apps/**/Cargo.toml",
  "crates/**/Cargo.toml",
  "apps/**/src/**/*.rs",
  "crates/**/src/**/*.rs"
]


[tasks.check-code-format]
cmd = "cargo fmt -- --check"
cwd = "."
description = "Check code formatting"
inputs = [
  "Cargo.toml",
  "apps/**/Cargo.toml",
  "crates/**/Cargo.toml",
  "apps/**/src/**/*.rs",
  "crates/**/src/**/*.rs"
]


# =============================================================================
# Clean Actions
# =============================================================================

[tasks.clean-all]
cmd = "./pixi-scripts/clean-all.sh"
cwd = "."
description = "Clean all build artifacts"

[tasks.clean-debian]
cmd = "rm -rf .build/deb"
description = "Clean Debian build artifacts"

[tasks.clean-rpm]
cmd = "rm -rf .build/rpm"
description = "Clean RPM build artifacts"

[tasks.clean-pkgbuild]
cmd = "rm -rf .build/pkgbuild"
description = "Clean Arch Linux build artifacts"

[tasks.clean-binary]
cmd = "rm -rf .build/binary"
description = "Clean binary build artifacts"


# =============================================================================
# Verify Actions
# =============================================================================

[tasks.verify-pkgconfig]
cmd = "./pixi-scripts/verify-pkgconfig.sh"
cwd = "."
description = "Verify pkg-config setup"
inputs = ["scripts/env/setup-pkgconfig.sh"]

[tasks.test-pkgconfig]
cmd = "./pixi-scripts/test-pkgconfig.sh"
cwd = "."
description = "Test critical packages"
inputs = ["scripts/env/setup-pkgconfig.sh"]

[tasks.verify-webkit-deps]
cmd = "./pixi-scripts/verify-webkit-deps.sh"
cwd = "."
description = "Check WebKit dependencies"
inputs = ["scripts/env/setup-pkgconfig.sh"]

[tasks.debug-env]
cmd = "./pixi-scripts/debug-env.sh"
cwd = "."
description = "Show environment debug info"

[tasks.verify-package-published]
cmd = "chmod +x pixi-scripts/verify-published-package.sh && ./pixi-scripts/verify-published-package.sh"
cwd = "."
description = "Verify published package availability"

# =============================================================================
# Debug Actions
# =============================================================================

[tasks.debug-build]
cmd = "./pixi-scripts/debug-build.sh"
cwd = "."
description = "Test build environment"
inputs = [
  "Cargo.toml",
  "Cargo.lock",
  "apps/gpclient/Cargo.toml",
  "apps/gpclient/src/**/*.rs",
  "crates/**/Cargo.toml",
  "crates/**/src/**/*.rs",
  "scripts/env/setup-pkgconfig.sh"
]

[tasks.debug-cli]
depends-on = [
  "clean-all",
  "build-cli",
  "test-cli",
  "package-cli",
  "view-package-contents",
]
description = "Debug: clean, build, test, package, inspect"

# =============================================================================
# Workflow Tasks
# =============================================================================

# CLI development workflow - build and test
[tasks.develop-cli]
depends-on = ["clean-all", "build-cli", "test-cli"]
description = "Development: clean, build, test"


# CLI shipping workflow - build, test, and package
[tasks.ship-cli]
depends-on = [
  "clean-all",
  "build-cli",
  "test-cli",
  "package-cli",
  "show-package-status",
]
description = "Shipping: clean, build, test, package"


# CLI debug workflow - build, test, package, and inspect


# CLI deployment workflow - complete build, test, package, and install
[tasks.deploy-cli]
depends-on = [
  "clean-all",
  "build-cli",
  "test-cli",
  "package-cli",
  "install-global-cli",
]
description = "Deploy: clean, build, test, package, install"

# =============================================================================
# Show/View Actions
# =============================================================================

[tasks.version]
cmd = "echo $PROJECT_VERSION"
description = "Show project version"

[tasks.build-docs-html]
cmd = "./pixi-scripts/build-docs-html.sh"
cwd = "."
description = "Build HTML documentation only"
inputs = [
  "docs/*.adoc",
  "docs/**/*.adoc"
]
outputs = ["output/docs/*.html"]


[tasks.build-docs-pdf]
cmd = "./pixi-scripts/build-docs-pdf.sh"
cwd = "."
description = "Build PDF documentation only"
inputs = [
  "docs/*.adoc",
  "docs/**/*.adoc"
]
outputs = ["output/docs/*.pdf"]


[tasks.build-docs]
depends-on = ["build-docs-html", "build-docs-pdf"]
description = "Build both HTML and PDF documentation"


[tasks.clean-docs]
cmd = "rm -rf output/docs"
cwd = "."
description = "Clean documentation build artifacts"

[tasks.view-docs-dev]
cmd = "./pixi-scripts/view-docs-dev.sh"
cwd = "."
description = "View developer documentation"
depends-on = ["build-docs-html"]

[tasks.view-docs-ops]
cmd = "./pixi-scripts/view-docs-ops.sh"
cwd = "."
description = "View operations documentation"
depends-on = ["build-docs-html"]

[tasks.view-docs-all]
cmd = "./pixi-scripts/view-docs-all.sh"
cwd = "."
description = "View all documentation"
depends-on = ["build-docs-html"]

# =============================================================================
# Install Actions
# =============================================================================

[tasks.install]
cmd = "./pixi-scripts/install.sh"
description = "Install binaries and files to system"
inputs = [
  "target/release/gpclient",
  "target/release/gpservice",
  "target/release/gpauth",
  "target/release/gpgui-helper",
  "packaging/files/**/*"
]

[tasks.uninstall]
cmd = "./pixi-scripts/uninstall.sh"
description = "Remove installed binaries and files from system"

[tasks.install-global-cli]
cmd = "./pixi-scripts/install-global-cli.sh"
cwd = "."
description = "Install CLI package globally (force reinstall)"
inputs = [
  "target/release/gpclient",
  "target/release/gpservice",
  "target/release/gpauth"
]

[tasks.install-global-full]
cmd = "./pixi-scripts/install-global-full.sh"
cwd = "."
description = "Install GUI package globally (force reinstall)"
inputs = [
  "target/release/gpclient",
  "target/release/gpservice",
  "target/release/gpauth",
  "target/release/gpgui-helper",
  "packaging/files/**/*"
]

# Complete installation workflow for full GUI package
[tasks.deploy-full]
depends-on = [
  "clean-all",
  "build-all",
  "test-all",
  "package-full",
  "install-global-full",
]
description = "Complete workflow for GUI package"

# =============================================================================
# Publish Actions
# =============================================================================

# Setup publishing environment (interactive guide)
[tasks.setup-publishing]
cmd = "chmod +x pixi-scripts/setup-prefix-publishing.sh && ./pixi-scripts/setup-prefix-publishing.sh"
cwd = "."
description = "Setup prefix.dev publishing (interactive)"
inputs = ["pixi-scripts/setup-prefix-publishing.sh"]

# Upload CLI package to prefix.dev meso-forge channel
[tasks.publish-cli]
cmd = "./pixi-scripts/publish-cli.sh"
cwd = "."
description = "Upload CLI package to prefix.dev"
inputs = ["output/*.conda"]

# Complete publish workflow - build and publish in one go
[tasks.publish-cli-complete]
depends-on = ["ship-cli", "publish-cli"]
description = "Build and publish CLI package"

# =============================================================================
# Help and information tasks
# =============================================================================

[tasks.show-help]
cmd = "./pixi-scripts/show-help.sh"
cwd = "."
description = "Show this help"
